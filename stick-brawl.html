const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function circRect(cx,cy,r,b){const x=clamp(cx,b.x1,b.x2),y=clamp(cy,b.y1,b.y2);return (cx-x)**2+(cy-y)**2<=r*r;}
function rectRect(a,b){return a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;}
function hash(a,b,c){let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}

/* ---------- audio ---------- */
let AC=null,musG=null,sfxG=null;
function audio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();musG=AC.createGain();sfxG=AC.createGain();musG.connect(AC.destination);sfxG.connect(AC.destination);applyVol();}catch(e){AC=null;}}
 if(AC&&AC.state==='suspended')AC.resume();
}
function applyVol(){if(!AC)return;musG.gain.value=(OPT.music/10)*.55*(Music.muted?0:1);sfxG.gain.value=OPT.sfx/10;}
addEventListener('pointerdown',audio);
function tone(f,d,type,vol,slide,dest,when){if(!AC)return;const t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+d+.02);}
let NOISEBUF=null;
function noise(d,vol,freq,dest,when,type){if(!AC)return;const t=when||AC.currentTime;
 if(!NOISEBUF){const len=AC.sampleRate;NOISEBUF=AC.createBuffer(1,len,AC.sampleRate);const dd=NOISEBUF.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=NOISEBUF;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+d+.02);}

/* ---------- music sequencer ---------- */
const NOTE_I={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){const m=n.match(/^([A-G]#?)(\d)$/);if(!m)return 0;return 440*Math.pow(2,(NOTE_I[m[1]]+12*(+m[2]+1)-69)/12);}
const TRACKS_SRC={
 menu:{bpm:96,

  lead:{w:'triangle',v:.16,s:'A4 - - - C5 - B4 - A4 - - - E4 - - - F4 - - - A4 - G4 - F4 - E4 - C4 - - - E4 - G4 - C5 - - - B4 - A4 - G4 - - - D4 - - - G4 - - - B4 - - - - - - -'},

  lead:{w:'sawtooth',v:.06,s:'D5 - . F5 . A5 . G5 - . F5 . D5 . . . C5 - . D5 . F5 . D5 - - - . . . . D5 - . F5 . A5 . C6 - . A5 . G5 . F5 . G5 - - - A5 - - - . . E5 . F5 - - - E5 - C5 -'},

  lead:{w:'square',v:.07,s:'E5 . B4 . E5 . G5 - - . F#5 . E5 . D5 . C5 - - - E5 . G5 . C6 - - . B5 . A5 . G5 - - - E5 . B4 . E5 . G5 - - . A5 . B5 . G5 - - - F#5 - - - D#5 - - - B4 - - -'},
  drum:'k . h . s . h . k . h k s k h .'},
 boss:{bpm:160,
  bass:{w:'sawtooth',v:.22,s:'E2 E2 F2 E2 E2 E2 F2 E2 E2 E2 F2 E2 G2 F2 E2 D2 E2 E2 F2 E2 E2 E2 F2 E2 A2 G2 F2 E2 F2 . F2 . E2 E2 F2 E2 E2 E2 F2 E2 E2 E2 F2 E2 G2 F2 E2 D2 C3 C3 B2 B2 A#2 A#2 A2 A2 G#2 G#2 G2 G2 F2 F2 E2 .'},
  lead:{w:'square',v:.07,s:'E5 - - - F5 - - - E5 - - - B4 - - - C5 - B4 - A4 - G4 - F4 - - - E4 - - - E5 - - - F5 - - - G5 - - - A5 - - - A#5 - A5 - G5 - F5 - E5 - - - - - - -'},
  drum:'x . h k s . h k x . h k s s s s'},
 win:{bpm:150,once:1,
  bass:{w:'triangle',v:.35,s:'C3 . . . G2 . . . C3 . . . . . . .'},

const TRACKS={};
for(const k in TRACKS_SRC){const s=TRACKS_SRC[k],t={bpm:s.bpm,once:s.once,parts:[]};let len=0;
 for(const pn of ['bass','lead']){let toks=s[pn].s.trim().split(/\s+/);toks=toks.slice(0,Math.max(16,Math.floor(toks.length/16)*16));t.parts.push({w:s[pn].w,v:s[pn].v,toks});len=Math.max(len,toks.length);}
 t.drum=s.drum.trim().split(/\s+/);t.len=len;TRACKS[k]=t;}
const Music={cur:null,step:0,next:0,muted:false,
 play(name){if(this.cur===name)return;this.cur=name;this.step=0;this.next=AC?AC.currentTime+.08:0;},
 stop(){this.cur=null;},
 toggleMute(){this.muted=!this.muted;applyVol();},
 tick(){
  if(!AC||!this.cur)return;const tr=TRACKS[this.cur],sp=60/tr.bpm/4,now=AC.currentTime;
  if(this.next<now-.3)this.next=now+.05;
  while(this.next<now+.15){
   if(tr.once&&this.step>=tr.len){this.cur=null;return;}
   const st=this.step%tr.len,t=this.next;
   for(const p of tr.parts){const tk=p.toks[st%p.toks.length];if(tk!=='.'&&tk!=='-'){let n=1;while(p.toks[(st+n)%p.toks.length]==='-'&&n<16)n++;
     const f=nfreq(tk);if(f)tone(f,sp*n*.95,p.w,p.v,0,musG,t);}}
   const d=tr.drum[st%tr.drum.length];
   if(d==='k'||d==='x'){tone(110,.14,'sine',.55,-70,musG,t);}
   if(d==='s'){noise(.12,.3,2200,musG,t,'bandpass');tone(190,.06,'triangle',.18,-60,musG,t);}
   if(d==='h'||d==='x'){noise(.03,.12,7000,musG,t,'highpass');}
   if(d==='o'){noise(.14,.12,6000,musG,t,'highpass');}
   this.step++;this.next+=sp;
  }
 }
};

const MAP=[
 {left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],lp:['KeyU'],hp:['KeyI'],lk:['KeyJ'],hk:['KeyK'],thr:['KeyO'],start:['Enter','Space'],back:['Escape','Backspace'],reset:['KeyR']},
 {left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],lp:['Numpad4'],hp:['Numpad5'],lk:['Numpad1'],hk:['Numpad2'],thr:['Numpad0','Numpad3'],start:['NumpadEnter'],back:[],reset:[]}
];
const BTNS=['left','right','up','down','lp','hp','lk','hk','thr','start','back','reset'];
const ATK=['lp','hp','lk','hk'];
function mkIn(){const o={pr:{},bp:{},hist:[{x:0,y:0,f:0}],cmd:null};for(const b of BTNS){o[b]=false;o.pr[b]=false;o.bp[b]=-999;}return o;}
const inp=[mkIn(),mkIn()];let prevRaw=[{},{}];let soloInput=true;
function readRaw(i,pads){
 const raw={};const maps=soloInput&&i===0?[MAP[0],MAP[1]]:[MAP[i]];
 for(const b of BTNS)raw[b]=maps.some(m=>m[b].some(c=>keys[c]));
 const padIdx=soloInput?(i===0?[0,1,2,3]:[]):[i];
 for(const pi of padIdx){const gp=pads&&pads[pi];if(!gp||!gp.connected)continue;
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0,B=n=>!!(gp.buttons[n]&&gp.buttons[n].pressed);
  raw.left=raw.left||ax<-.5||B(14);raw.right=raw.right||ax>.5||B(15);raw.up=raw.up||ay<-.55||B(12);raw.down=raw.down||ay>.55||B(13);
  raw.lp=raw.lp||B(2);raw.hp=raw.hp||B(3);raw.lk=raw.lk||B(0);raw.hk=raw.hk||B(1);raw.thr=raw.thr||B(4)||B(5);
  raw.start=raw.start||B(9);raw.back=raw.back||B(8);raw.reset=raw.reset||B(10)||B(11);}
 return raw;
}
function pollInput(){
 let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
 for(let i=0;i<2;i++){
  const raw=readRaw(i,pads),st=inp[i];
  for(const b of BTNS){st.pr[b]=raw[b]&&!prevRaw[i][b];st[b]=raw[b];if(st.pr[b])st.bp[b]=gt;}
  if(st.pr.thr){st.bp.lp=gt;st.bp.lk=gt;st.pr.lp=st.pr.lk=true;}
  const x=(st.right?1:0)-(st.left?1:0),y=(st.up?1:0)-(st.down?1:0),last=st.hist[st.hist.length-1];
  if(last.x!==x||last.y!==y){st.hist.push({x,y,f:gt});if(st.hist.length>32)st.hist.shift();}
  prevRaw[i]=raw;
 }
}
const anyIn=()=>{const o={pr:{}};for(const b of BTNS){o[b]=inp[0][b]||inp[1][b];o.pr[b]=inp[0].pr[b]||inp[1].pr[b];}return o;};
/* motion reading: numpad notation relative to facing */
function numpad(e,face){const rx=e.x*face;return (e.y<0?1:e.y>0?7:4)+rx+1;}
function recentDirs(c,face,win){const h=c.hist,out=[];let i=h.length-1;while(i>0&&h[i].f>=gt-win)i--;for(;i<h.length;i++)out.push(numpad(h[i],face));return out;}
function seqMatch(list,pat){let j=0;for(const d of list){if(d===pat[j]){j++;if(j===pat.length)return true;}}return false;}
const MOTIONS={sup:{win:36,p:[[2,3,6,2,3,6],[2,6,2,6],[2,3,6,3,6]]},dp:{win:18,p:[[6,2,3],[6,3,2,3]]},qcf:{win:16,p:[[2,3,6],[2,6]]},qcb:{win:16,p:[[2,1,4],[2,4]]}};
const MOT_END={sup:[6,3],dp:[3],qcf:[6,3],qcb:[4,1]};
function hasMotion(c,face,m){const M=MOTIONS[m],l=recentDirs(c,face,M.win);if(!MOT_END[m].includes(l[l.length-1]))return false;return M.p.some(p=>seqMatch(l,p));}
function dashTap(c,face){const h=c.hist,n=h.length;if(n<3||h[n-1].f!==gt||h[n-1].y!==0)return 0;
 const a=h[n-3],b=h[n-2],d=h[n-1];if(gt-a.f>14)return 0;if(b.x!==0||b.y!==0||a.y!==0||a.x!==d.x||d.x===0)return 0;return d.x*face;}

const STAGES={

   CPU opponent + training dummy
   ===================================================================== */
function cpuInput(){return {isCpu:true,cmd:null,left:false,right:false,up:false,down:false,pr:{},bp:{},hist:[{x:0,y:0,f:0}]};}
const DIFF_LV=[.12,.45,.8];
class CPU{
 constructor(f,level){this.f=f;this.L=clamp(level,0,1);this.c=cpuInput();this.plan=null;this.pt=0;this.queue=[];this.pendMv=null;this.blockT=0;this.blockLow=false;this.seenMv=null;this.react=-1;this.aaJump=null;
  const L=this.L;this.P={think:Math.round(lerp(26,6,L)),block:lerp(.08,.85,L),rd:Math.round(lerp(14,3,L)),aa:lerp(.08,.8,L),combo:lerp(.15,.9,L),tech:lerp(0,.6,L),punish:lerp(.1,.85,L)};}
 tag(t){return this.f.ch.specials.find(s=>s.tag===t);}
 spCmd(sp,str){str=str||(Math.random()<.5?'l':'h');return {t:'sp',sp,str,btn:str+sp.btn};}
 think(o,g,canAct){
  const f=this.f,c=this.c,P=this.P;c.cmd=null;c.left=c.right=c.up=c.down=false;
  if(!canAct||!o){this.plan=null;this.queue=[];return c;}
  const fk=f.face>0?'right':'left',bk=f.face>0?'left':'right',dist=Math.abs(o.x-f.x);
  if(f.state==='thrown'){if(f.t===4&&Math.random()<P.tech)c.cmd={t:'throw'};return c;}
  if(f.state==='dizzy')return c;
  // combo continuation
  if(this.queue.length){
   if(f.state==='attack'){
    if(this.pendMv&&f.mv!==this.pendMv){this.queue.shift();this.pendMv=null;}
    if(this.queue.length&&f.contact){const q=this.queue[0];c.cmd=q.cmd;c.down=!!q.down;this.pendMv=f.mv;return c;}
    if(this.queue.length&&f.mv&&f.mf>f.mv.su+f.mv.ac+2&&!f.contact)this.queue=[];
    return c;
   } else if(!FREE[f.state]){this.queue=[];}
  }
  // reactive block
  if(o.state==='attack'&&o.mv&&o.mv!==this.seenMv){this.seenMv=o.mv;const reach=o.mv.proj||o.mv.dashV||o.mv.spin||dist<230;
   if(reach&&!o.mv.throw&&!o.mv.grab&&Math.random()<P.block){this.react=gt+P.rd;this.blockLow=o.mv.type==='low';this.blockHigh=o.mv.type==='high';}}
  const inc=g.projs.find(q=>q.owner!==f&&Math.sign(f.x-q.x)===Math.sign(q.vx)&&Math.abs(q.x-f.x)<320);
  if(inc&&this.react<0&&this.blockT<=0&&Math.random()<P.block*.08){
   if(Math.random()<.35&&!inc.big&&inc.kind!=='lob'&&FREE[f.state]){c.up=true;c[fk]=true;return c;}
   this.blockT=24;this.blockLow=inc.type==='low';this.blockHigh=false;
  }
  if(this.react>=0&&gt>=this.react){this.react=-1;this.blockT=18;}
  if(this.blockT>0){this.blockT--;c[bk]=true;if(this.blockLow||(!this.blockHigh&&o.crouched()&&Math.random()<.5))c.down=true;return c;}
  if(!FREE[f.state]&&f.state!=='jump')return c;
  // air: attack when near
  if(f.state==='jump'){if(!f.airAtk&&dist<190&&f.vy<3&&Math.random()<.35)c.cmd={t:'n',btn:Math.random()<.6?'hk':'hp'};return c;}
  // anti-air
  const aaKey=gt-o.t;
  if(o.state==='jump'&&o.vy<4&&dist<240&&Math.sign(o.vx||0)!==-Math.sign(f.x-o.x)&&this.aaJump!==aaKey){
   this.aaJump=aaKey;
   if(Math.random()<P.aa){const aa=this.tag('aa');c.cmd=aa?this.spCmd(aa,'h'):{t:'n',btn:'hp'};if(!aa)c.down=true;return c;}
  }
  if(this.plan&&--this.pt>0){this.applyPlan(c,fk,bk);return c;}
  this.decide(o,g,c,dist,fk,bk);
  return c;
 }
 applyPlan(c,fk,bk){const p=this.plan;if(p.dir===1)c[fk]=true;else if(p.dir===-1)c[bk]=true;if(p.down)c.down=true;}
 combo(){
  const f=this.f,ender=()=>{if(f.meter>=100&&Math.random()<.6)return {cmd:{t:'super'}};const s=pick(f.ch.specials.filter(s=>s.kind!=='grab'&&s.kind!=='tele'));return s?{cmd:this.spCmd(s,'h')}:null;};
  const routes=[[{cmd:{t:'n',btn:'lk'},down:1},{cmd:{t:'n',btn:'lp'},down:1},ender()],[{cmd:{t:'n',btn:'lp'}},{cmd:{t:'n',btn:'hp'}},ender()],[{cmd:{t:'n',btn:'hp'}},ender()],[{cmd:{t:'n',btn:'lp'},down:1},{cmd:{t:'n',btn:'hk'},down:1}]];
  const r=pick(routes).filter(Boolean);
  if(Math.random()>this.P.combo)r.length=1;
  return r;
 }
 decide(o,g,c,dist,fk,bk){
  const f=this.f,P=this.P,r=Math.random(),ch=f.ch.id,zoner=ch==='dart',grap=ch==='grip';
  this.plan={dir:0,down:0};this.pt=P.think+((Math.random()*P.think)|0);
  const proj=this.tag('proj'),rush=this.tag('rush'),own=g.projs.some(p=>p.owner===f&&!p.sup);
  if(f.meter>=100&&dist<(f.ch.super.kind==='grab'?150:420)&&r<.18){c.cmd={t:'super'};return;}
  const whiff=(o.state==='attack'&&o.mv&&!o.contact&&o.mf>o.mv.su+o.mv.ac)||o.state==='recover';
  if(whiff&&dist<200&&Math.random()<P.punish){const q=this.combo();q.unshift({cmd:{t:'n',btn:'hp'}});this.startQueue(c,q.slice(0,3));return;}
  if(dist>380){
   if(proj&&!own&&r<(zoner?.55:.3)){c.cmd=this.spCmd(proj);return;}
   if(zoner&&this.tag('proj2')&&r<.65&&!own){c.cmd=this.spCmd(this.tag('proj2'));return;}
   if(r<.12){c.cmd={t:'dash',d:1};return;}
   if(r<.2&&!zoner){c.up=true;c[fk]=true;return;}
   this.plan.dir=zoner&&r<.6?0:1;return;
  }
  if(dist>140){
   if(zoner&&dist<280&&r<.35){c.cmd={t:'dash',d:-1};return;}
   if(proj&&!own&&r<(zoner?.4:.18)){c.cmd=this.spCmd(proj);return;}
   if(this.tag('tele')&&r<.26&&r>=.18){c.cmd=this.spCmd(this.tag('tele'),'l');return;}
   if(rush&&r<.3&&r>=.22){c.cmd=this.spCmd(rush);return;}
   if(r<.4){c.up=true;c[fk]=true;return;}
   if(r<.5){c.cmd={t:'n',btn:'lk'};c.down=true;return;}
   this.plan.dir=r<.88?1:-1;return;
  }
  if(grap&&r<.3&&o.throwable()){c.cmd=this.spCmd(this.tag('grab'),Math.random()<.5?'l':'h');return;}
  if(r<.12&&o.throwable()){c.cmd={t:'throw'};return;}
  if(r<.62){this.startQueue(c,this.combo());return;}
  if(r<.72){c.cmd={t:'dash',d:-1};return;}
  if(r<.8){c.up=true;c[bk]=true;return;}
  this.plan.dir=-1;this.pt=Math.max(8,this.pt>>1);
 }
 startQueue(c,q){if(!q.length)return;const first=q.shift();c.cmd=first.cmd;c.down=!!first.down;this.queue=q;this.pendMv=null;this.firstPending=true;}
}
const DUMMY_MODES=[['stand','STAND'],['crouch','CROUCH'],['jump','JUMP'],['block','BLOCK ALL'],['block1','BLOCK AFTER 1ST HIT'],['cpu','CPU (fights back)']];
class Dummy{
 constructor(f,T){this.f=f;this.T=T;this.cpu=new CPU(f,.55);this.c=cpuInput();}
 think(o,g,canAct){
  const T=this.T,f=this.f,c=this.c;
  if(T.dummy==='cpu')return this.cpu.think(o,g,canAct);
  c.cmd=null;c.left=c.right=c.up=c.down=false;if(!canAct)return c;
  if(f.state==='thrown'){if(T.tech&&f.t===4)c.cmd={t:'throw'};return c;}
  const bk=f.face>0?'left':'right';
  const doBlock=()=>{c[bk]=true;const low=(o.state==='attack'&&o.mv&&o.mv.type==='low')||g.projs.some(p=>p.owner===o&&p.type==='low');const high=o.state==='attack'&&o.mv&&o.mv.type==='high';if(low||(!high&&T.dummyCrouchBlock))c.down=true;};
  switch(T.dummy){
   case 'crouch':c.down=true;break;
   case 'jump':c.up=true;break;
   case 'block':doBlock();break;
   case 'block1':if(f.combo>0||f.state==='blockstun'||gt-f.lastHitT<40||(this.blockUntil&&gt<this.blockUntil)){doBlock();if(f.state==='blockstun')this.blockUntil=gt+30;}break;
  }
  return c;
 }
}

const BOSS_CH={id:'hand',name:'THE HAND',color:'#b5835a',dark:'#8a5a30',power:1,hp:2400,stage:'final',scale:1};
class Hand{
 constructor(){Object.assign(this,{x:W/2,y:-260,tx:W/2,ty:210,ang:0,tang:0,state:'enter',t:0,hp:BOSS_CH.hp,dispHp:BOSS_CH.hp,ch:BOSS_CH,meter:0,comboShow:0,comboT:0,
  face:1,flash:0,combo:0,lastHit:-999,hitDone:false,lastAtk:'',phase:1,sweepDir:1,flicks:0,scrib:[],pencilDrop:null,rage:false,idx:1,invul:0,vx:0,grounded:false});}
 get tip(){const a=this.ang;return {x:this.x-Math.sin(a)*220,y:this.y+Math.cos(a)*220};}
 get eraser(){const a=this.ang;return {x:this.x+Math.sin(a)*130,y:this.y-Math.cos(a)*130};}
 hurtboxes(){
  const b=[{x1:this.x-70,x2:this.x+70,y1:this.y-60,y2:this.y+55}];
  if(this.state==='stuck'||this.state==='pull'){const t=this.tip;b.push({x1:t.x-20,x2:t.x+20,y1:this.y+40,y2:t.y});}
  return b;
 }
 set(s){this.state=s;this.t=0;this.hitDone=false;}
 update(g,canAct){
  this.t++;if(this.flash>0)this.flash--;if(this.comboT>0)this.comboT--;
  if(gt-this.lastHit>60)this.combo=0;

  this.ang+=(this.tang-this.ang)*.18;
  if(this.dispHp>this.hp)this.dispHp=Math.max(this.hp,this.dispHp-6);
  const bob=Math.sin(gt*.05)*10;
  switch(this.state){
   case 'enter':this.y=lerp(-260,210,Math.min(1,this.t/90));if(this.t>=100)this.set('hover');break;
   case 'hover':{
    if(!canAct)break;
    this.tx=clamp(P.x+(P.x<W/2?160:-160),220,W-220);this.ty=200+bob;
    this.x+=(this.tx-this.x)*.05;this.y+=(this.ty-this.y)*.08;
    if(this.t>=[70,50,36][ph-1])this.choose(g);break;}
   case 'stabWind':{
    const lock=this.t>[40,32,24][ph-1];if(!lock)this.tx=clamp(P.x,WALL_L+40,WALL_R-40);
    this.x+=(this.tx-this.x)*(lock?.0:.2);this.y+=((150)-this.y)*.15;
    if(this.t===1)SFX.warn();
    if(this.t>=[56,44,34][ph-1])this.set('stab');break;}
   case 'stab':{
    this.y+=32;const t=this.tip;
    if(!this.hitDone&&rectRect({x1:t.x-26,x2:t.x+26,y1:t.y-90,y2:t.y},P.hurtbox())&&P.invul<=0&&P.state!=='ko'){this.hitDone=true;g.applyHit(this,P,{dmg:130,raw:1,kb:6,hs:22,type:'high',kd:1},t.x,t.y-30);}
    if(t.y>=GROUND+6){this.y-=t.y-(GROUND+6);this.set('stuck');SFX.stab();g.shake=16;g.dust(t.x,16);g.splat(t.x,GROUND-6,1.6);}

class BossMatch extends Match{
 constructor(c1,opts){super(c1,c1,Object.assign({},opts,{stage:'final',noTimer:1}));this.f=[this.f[0]];this.boss=new Hand();this.hazards=[];this.phase='intro';this.isBoss=true;}
 projTarget(p){return p.owner===this.boss?this.f[0]:this.boss;}
 projHit(p){
  if(this.phase!=='fight')return;
  if(p.owner===this.boss){const d=this.f[0];if(d.invul<=0&&d.state!=='ko'&&circRect(p.x,GROUND-p.y,p.r*.85,d.hurtbox())){p.dead=true;this.applyHit(this.boss,d,{dmg:p.dmg,raw:1,kb:6,hs:18,type:p.type,proj:1},p.x,GROUND-p.y);}return;}
  for(const hb of this.boss.hurtboxes())if(circRect(p.x,GROUND-p.y,p.r,hb)){p.dead=true;this.hitBoss(p.owner,{dmg:p.dmg*(p.big?1:1),raw:1,sup:p.big},p.x,GROUND-p.y);return;}
 }
 hitBoss(a,mv,x,y){
  const B=this.boss;if(B.state==='dying'||B.state==='enter')return;
  const raw=mv.raw?mv.dmg:mv.dmg*a.ch.power;const sc=Math.max(.4,1-B.combo*.07);const dmg=Math.round(raw*sc);
  B.hp-=dmg;B.combo++;B.lastHit=gt;B.flash=6;if(B.combo>=2){a.comboShow=B.combo;a.comboT=70;}
  a.meter=Math.min(100,a.meter+dmg*.11);
  const big=dmg>=70||mv.sup;this.spark(x,y,big?'#ffd60a':'#ff8800',big?16:10);this.splat(x,y,big?1.3:.8);
  this.shake=Math.max(this.shake,big?12:5);this.hitstop=big?8:5;(big?SFX.heavy:SFX.hit)();
  if(B.hp<=0){B.hp=0;B.set('dying');this.phase='bossdown';this.pt=0;this.projs=this.projs.filter(p=>p.owner!==B);this.hazards=[];}
 }
 step(){
  const p=this.f[0],B=this.boss;this.pt++;this.updFx();
  if(this.superFlash>0){this.superFlash--;return;}
  if(this.hitstop>0){this.hitstop--;return;}
  if(this.phase==='ko'&&this.pt<70&&this.pt%3!==0)return;
  const canAct=this.phase==='fight';
  p.update(this.input(0),B,this,canAct);p.computeJ();
  B.update(this,canAct);
  if(canAct&&p.state==='attack'&&!p.hasHit&&p.mv&&!p.mv.throw&&!p.mv.grab){
   outer:for(const hp of p.hitPoints())for(const hb of B.hurtboxes())if(circRect(hp.x,hp.y,hp.r,hb)){p.hasHit=true;p.hits++;if(p.mv.multi)p.rehitAt=p.mf+p.mv.rehit;p.contact=true;this.hitBoss(p,p.mv,hp.x,hp.y);break outer;}
  }
  this.updProjs();
  for(const h of this.hazards){h.t++;if(canAct&&h.t>h.warn&&p.invul<=0&&p.state!=='ko'&&rectRect({x1:h.x-h.w/2,x2:h.x+h.w/2,y1:GROUND-50,y2:GROUND},p.hurtbox())&&p.grounded===true){this.applyHit(B,p,{dmg:70,raw:1,unblock:1,kd:1,kb:6,hs:20},p.x,GROUND-30);}}
  this.hazards=this.hazards.filter(h=>h.t<h.life);
  if(p.dispHp>p.hp)p.dispHp=Math.max(p.hp,p.dispHp-(p.combo>0?1:7));else p.dispHp=p.hp;
  switch(this.phase){
   case 'intro':if(this.pt===1)SFX.round();if(this.pt===100)SFX.confirm();if(this.pt>=150){this.phase='fight';this.pt=0;}break;
   case 'fight':if(p.hp<=0){this.phase='ko';this.pt=0;}break;
   case 'ko':if(this.pt===110)this.msg='THE HAND WINS';if(this.pt>=230){this.phase='over';this.pt=0;this.matchWinner=1;}break;
   case 'bossdown':if(this.pt===60){p.mv=null;p.setState('win');this.msg='YOU WIN!';}if(this.pt>=230){this.phase='over';this.pt=0;this.matchWinner=0;}break;
  }
 }
}

/* =====================================================================
   Scenes: title, menus, select, stage, VS, fight, pause, continue, ending
   ===================================================================== */
let scene='title',sceneT=0,menuIdx=0,mode='arcade',match=null,demo=null,sel=null,stageSel=0,paused=false,pauseIdx=0,showMoves=false,helpPage=0;
let arcade=null,T=null,inputLog=[],vsF=null;
function go(s){scene=s;sceneT=0;menuIdx=0;}
function newDemo(){demo=new Match(pick(CHARS),pick(CHARS),{stage:pick(STAGE_IDS)});demo.ctl=[new CPU(demo.f[0],.8),new CPU(demo.f[1],.8)];}
newDemo();
const previews=CHARS.map(c=>{const f=new Fighter(c,0);f.pv=.6;return f;});
const MAIN_MENU=['ARCADE','VERSUS CPU','2 PLAYERS','TRAINING','OPTIONS','HOW TO PLAY'];
const GLYPH={1:'↙',2:'↓',3:'↘',4:'←',5:'•',6:'→',7:'↖',8:'↑',9:'↗'};
function moveLines(ch){return ch.specials.map(s=>[s.name,MOTION_TXT[s.motion]+' + '+(s.btn==='p'?'P':'K')]).concat([[ch.super.name+'  (SUPER)',MOTION_TXT.sup+' + P or K']]);}
const UNIVERSAL=[['Throw (close)','LP + LK   (tech: LP + LK when grabbed)'],['Dash / Backdash','→ →  /  ← ←'],['Sweep (low, knockdown)','↓ + HK'],['Anti-air uppercut','↓ + HP'],['Combos','Lights chain into anything; normals cancel into specials; specials cancel into super']];

function startSelect(){soloInput=mode!=='2p';sel={cur:[0,1],lock:[false,false],step:0,t:0};go('select');Music.play('menu');}
function startMatch(stage){
 const c1=CHARS[sel.cur[0]],c2=CHARS[sel.cur[1]];
 if(mode==='training'){T={dummy:'stand',boxes:false,meter:true,tech:false,input:true,adv:null,combo:null};match=new Match(c1,c2,{stage,training:T});match.ctl[1]=new Dummy(match.f[1],T);match.ctlName=[null,'DUMMY'];inputLog=[];}
 else if(mode==='vcpu'){match=new Match(c1,c2,{stage});match.ctl[1]=new CPU(match.f[1],DIFF_LV[OPT.diff]);match.ctlName=[null,'CPU'];}
 else{match=new Match(c1,c2,{stage});match.ctlName=['P1','P2'];}
 paused=false;showMoves=false;go('fight');Music.play(STAGES[stage].music);
}
function startArcade(){const c=CHARS[sel.cur[0]];arcade={c,ladder:shuffle(CHARS.filter(x=>x!==c)).map(x=>x.id).concat(['hand']),idx:0,cont:0,start:gt};toVS();}
function toVS(){const id=arcade.ladder[arcade.idx];vsF=[new Fighter(arcade.c,0),id==='hand'?null:new Fighter(charById(id),1)];
 vsF[0].pv=1.2;vsF[0].x=300;vsF[0].gy=600;vsF[0].face=1;if(vsF[1]){vsF[1].pv=1.2;vsF[1].x=W-300;vsF[1].gy=600;vsF[1].face=-1;}go('vs');Music.play('menu');}
function arcadeFight(){
 const id=arcade.ladder[arcade.idx];soloInput=true;
 if(id==='hand'){match=new BossMatch(arcade.c,{});match.ctlName=[null];Music.play('boss');}
 else{const opp=charById(id);match=new Match(arcade.c,opp,{stage:opp.stage});match.ctl[1]=new CPU(match.f[1],clamp(DIFF_LV[OPT.diff]-.2+arcade.idx*.1,0,1));match.ctlName=[null,'CPU'];Music.play(STAGES[opp.stage].music);}
 paused=false;showMoves=false;go('fight');
}
function pauseItems(){
 if(mode==='training'&&match&&match.training){const t=match.training,on=b=>b?'ON':'OFF';
  return ['RESUME','DUMMY: '+DUMMY_MODES.find(d=>d[0]===t.dummy)[1],'DUMMY TECHS THROWS: '+on(t.tech),'HITBOXES: '+on(t.boxes),'INFINITE SUPER: '+on(t.meter),'INPUT DISPLAY: '+on(t.input),'RESET POSITIONS','MOVE LIST','CHARACTER SELECT','QUIT TO MENU'];}
 return mode==='arcade'?['RESUME','MOVE LIST','QUIT TO MENU']:['RESUME','MOVE LIST','RESTART MATCH','CHARACTER SELECT','QUIT TO MENU'];
}
function flushUsed(){if(match)for(const f of match.f)for(const k of ATK)f.used[k]=gt;}
function pauseAction(item,dir){
 const t=match.training;
 if(item==='RESUME'){paused=false;flushUsed();return;}
 if(item==='MOVE LIST'){showMoves=true;return;}
 if(item==='QUIT TO MENU'){paused=false;go('menu');Music.play('menu');return;}
 if(item==='CHARACTER SELECT'){paused=false;startSelect();return;}
 if(item==='RESTART MATCH'){startMatch(match.stage);return;}
 if(item==='RESET POSITIONS'){match.startRound();paused=false;flushUsed();return;}
 if(item.startsWith('DUMMY:')){const i=DUMMY_MODES.findIndex(d=>d[0]===t.dummy);t.dummy=DUMMY_MODES[(i+(dir<0?DUMMY_MODES.length-1:1))%DUMMY_MODES.length][0];return;}
 if(item.startsWith('DUMMY TECHS'))t.tech=!t.tech;
 if(item.startsWith('HITBOXES'))t.boxes=!t.boxes;
 if(item.startsWith('INFINITE'))t.meter=!t.meter;
 if(item.startsWith('INPUT'))t.input=!t.input;
}
function logInput(){
 const c=inp[0],f=match.f[0];const d=numpad({x:(c.right?1:0)-(c.left?1:0),y:(c.up?1:0)-(c.down?1:0)},f.face);
 const b=ATK.filter(k=>c.pr[k]).map(k=>k.toUpperCase()).join(' ');const last=inputLog[0];
 if(last&&last.d===d&&!b)last.n++;else{inputLog.unshift({d,b,n:1});if(inputLog.length>14)inputLog.pop();}
}

function step(){
 gt++;sceneT++;pollInput();Music.tick();
 const A=anyIn(),conf=A.pr.start||A.pr.lp||A.pr.lk,back=A.pr.back||A.pr.hk;
 const nav=n=>{if(A.pr.up){menuIdx=(menuIdx+n-1)%n;SFX.select();}if(A.pr.down){menuIdx=(menuIdx+1)%n;SFX.select();}};
 switch(scene){
  case 'title':soloInput=true;Music.play('menu');demo.step();if(demo.phase==='over'&&demo.pt>90)newDemo();if(conf&&sceneT>10){SFX.confirm();go('menu');}break;
  case 'menu':
   demo.step();if(demo.phase==='over'&&demo.pt>90)newDemo();nav(MAIN_MENU.length);
   if(conf){SFX.confirm();const it=MAIN_MENU[menuIdx];
    if(it==='ARCADE'){mode='arcade';startSelect();}else if(it==='VERSUS CPU'){mode='vcpu';startSelect();}else if(it==='2 PLAYERS'){mode='2p';startSelect();}
    else if(it==='TRAINING'){mode='training';startSelect();}else if(it==='OPTIONS')go('options');else{helpPage=0;go('help');}}
   else if(back){SFX.back();go('title');}break;
  case 'options':{
   nav(5);const d=A.pr.right?1:A.pr.left?-1:0;
   if(d||conf){const dd=d||1;
    if(menuIdx===0)OPT.music=clamp(OPT.music+dd,0,10);if(menuIdx===1)OPT.sfx=clamp(OPT.sfx+dd,0,10);if(menuIdx===2)OPT.diff=(OPT.diff+dd+3)%3;if(menuIdx===3)OPT.boil=OPT.boil?0:1;
    if(menuIdx===4&&conf){saveOpt();go('menu');SFX.back();break;}saveOpt();SFX.select();}
   if(back){saveOpt();go('menu');SFX.back();}break;}
  case 'help':if(A.pr.left||A.pr.right){helpPage^=1;SFX.select();}else if(conf||back){go('menu');SFX.back();}break;
  case 'select':{
   for(const f of previews)f.t++;
   const two=mode==='2p';
   if(two){for(const i of [0,1]){const c=inp[i];
     if(!sel.lock[i]){if(c.pr.left){sel.cur[i]=(sel.cur[i]+5)%6;SFX.select();}if(c.pr.right){sel.cur[i]=(sel.cur[i]+1)%6;SFX.select();}if(c.pr.lp||c.pr.lk||c.pr.start){sel.lock[i]=true;SFX.confirm();}}
     else if(c.pr.hk||c.pr.back){sel.lock[i]=false;SFX.back();}}
    if(!sel.lock[0]&&!sel.lock[1]&&A.pr.back&&sceneT>5){go('menu');SFX.back();break;}
    if(sel.lock[0]&&sel.lock[1]&&++sel.t>40){stageSel=0;go('stage');}
   }else{
    const s=sel.step;
    if(!sel.lock[s]){if(A.pr.left){sel.cur[s]=(sel.cur[s]+5)%6;SFX.select();}if(A.pr.right){sel.cur[s]=(sel.cur[s]+1)%6;SFX.select();}
     if(conf){sel.lock[s]=true;SFX.confirm();sel.t=0;if(s===0&&mode!=='arcade'){sel.step=1;sel.cur[1]=(sel.cur[0]+1)%6;}}
     else if(back){if(s===1){sel.step=0;sel.lock[0]=false;SFX.back();}else{go('menu');SFX.back();}}}
    else if(++sel.t>30){if(mode==='arcade')startArcade();else{stageSel=STAGE_IDS.indexOf(CHARS[sel.cur[1]].stage);go('stage');}}
   }
   break;}
  case 'stage':{
   const n=STAGE_IDS.length+1;if(A.pr.left){stageSel=(stageSel+n-1)%n;SFX.select();}if(A.pr.right){stageSel=(stageSel+1)%n;SFX.select();}
   if(conf&&sceneT>8){SFX.confirm();startMatch(stageSel<STAGE_IDS.length?STAGE_IDS[stageSel]:pick(STAGE_IDS));}
   else if(back){SFX.back();sel={cur:sel.cur,lock:[false,false],step:0,t:0};go('select');}break;}
  case 'vs':for(const f of vsF)if(f){f.t++;f.state=sceneT>40?'win':'idle';}if(sceneT>170||(conf&&sceneT>30)){SFX.confirm();arcadeFight();}break;
  case 'fight':{
   if(showMoves){if(conf||back){showMoves=false;SFX.back();}break;}
   if(paused){const items=pauseItems();nav(items.length);const d=A.pr.right?1:A.pr.left?-1:0;
    if(conf||(d&&items[menuIdx].includes(':'))){SFX.select();pauseAction(items[menuIdx],d);}else if(back){paused=false;flushUsed();SFX.back();}break;}
   if(match.phase!=='over'&&(A.pr.back||(A.pr.start&&match.phase==='fight'))){paused=true;menuIdx=0;SFX.select();break;}
   if(match.training&&A.pr.reset){match.startRound();SFX.select();}
   match.step();
   if(match.training&&match.training.input)logInput();
   if(match.phase==='over'&&match.pt>60){
    if(mode==='arcade'){
     if(match.matchWinner===0){if((match.pt>100&&conf)||match.pt>260){arcade.idx++;if(arcade.idx>=arcade.ladder.length){go('ending');Music.play('win');}else toVS();}}
     else{go('continue');Music.stop();}
    }else{if(A.pr.start){SFX.confirm();startMatch(match.stage);}else if(back){SFX.back();startSelect();}}
   }
   break;}
  case 'continue':if(conf&&sceneT>20&&sceneT<600){arcade.cont++;SFX.confirm();toVS();}else if(sceneT>=720||(back&&sceneT>20)){go('title');}break;
  case 'ending':if(sceneT===260)Music.play('menu');if(conf&&sceneT>120){go('title');}break;
 }
}

function render(){
 ctx.setTransform(1,0,0,1,0,0);
 switch(scene){
  case 'title':{drawMatch(demo,false);ctx.fillStyle='rgba(251,247,234,.45)';ctx.fillRect(0,0,W,H);
   bigText('STICK',W/2-10,180,150,'#e63946',-.06);bigText('BRAWL',W/2+40,320,150,'#3a86ff',.04);bigText('TURBO DOODLE EDITION',W/2+20,420,36,'#ffd60a',-.03);
   if((gt>>5)%2===0)label('PRESS ENTER',W/2,530,40,'#222');label('M = mute music',W/2,690,18,'#666');break;}
  case 'menu':{drawMatch(demo,false);ctx.fillStyle='rgba(251,247,234,.82)';ctx.fillRect(0,0,W,H);
   bigText('STICK BRAWL',W/2,100,84,'#e63946',-.03);ctx.font='bold 40px '+FONT;
   MAIN_MENU.forEach((t,i)=>{const y=210+i*72,on=i===menuIdx;if(on){bigText(t,W/2,y,50,'#ffd60a',Math.sin(gt*.1)*.02);bigText('>',W/2-260,y,50,'#e63946');}else smallText(t,W/2,y,40,'#555');});
   const tips={ARCADE:'Beat 5 rivals, then face THE HAND.','VERSUS CPU':'Pick both fighters and a stage.','2 PLAYERS':'Same keyboard, or plug in gamepads.',TRAINING:'Practice combos with hitboxes and frame data.',OPTIONS:'Volume, difficulty, sketch wobble.','HOW TO PLAY':'Controls and fighting basics.'};
   label(tips[MAIN_MENU[menuIdx]],W/2,660,24,'#444');break;}
  case 'options':{paperBg(.6);bigText('OPTIONS',W/2,90,70,'#3a86ff',-.02);
   const it=['MUSIC VOLUME:  < '+OPT.music+' >','SOUND FX VOLUME:  < '+OPT.sfx+' >','CPU LEVEL:  < '+['EASY','NORMAL','HARD'][OPT.diff]+' >','SKETCH WOBBLE:  < '+(OPT.boil?'ON':'OFF')+' >','BACK'];
   it.forEach((t,i)=>{const y=220+i*80;if(i===menuIdx)bigText(t,W/2,y,46,'#ffd60a');else smallText(t,W/2,y,38,'#555');});
   label('CPU level also sets the Arcade difficulty curve.',W/2,650,22,'#555');break;}
  case 'help':{paperBg(.75);
   if(helpPage===0){bigText('CONTROLS',W/2,70,64,'#3a86ff',-.02);
    const L=[['','MOVE','LP','HP','LK','HK','THROW'],['PLAYER 1','W A S D','U','I','J','K','O'],['PLAYER 2','Arrows','Num 4','Num 5','Num 1','Num 2','Num 0'],['GAMEPAD','Stick / D-pad','X','Y','A','B','LB / RB']];
    const xs=[150,330,520,640,760,880,1020];L.forEach((r,j)=>r.forEach((c,i)=>smallText(c,xs[i],170+j*58,j?26:22,j?'#222':'#888',i?'center':'left')));
    const N=['Esc / Start = pause      R = reset (training)      M = mute music      Double-click = fullscreen','In single-player modes, either keyboard side works.','Player 2 on a laptop without a numpad: plug in a gamepad (Xbox controllers work).','Specials use joystick motions like ↓↘→ + punch. They are shown on the select screen and in the pause menu.'];
    N.forEach((n,i)=>smallText(n,W/2,440+i*48,21,'#333'));}
   else{bigText('FIGHTING BASICS',W/2,70,64,'#e63946',-.02);
    const B=[['BLOCK','Hold away from your opponent. Crouch-block lows (sweeps, Quake Wave). Stand-block jump-ins and paper balls.'],['THROW','LP+LK up close beats blocking. Press LP+LK right as you get grabbed to TECH (escape).'],['COMBOS','Light attacks chain into other attacks. Any normal that hits or is blocked can cancel into a special.'],['SUPER','Your meter fills as you fight. At SUPER READY: ↓↘→↓↘→ + any attack. Specials can cancel into supers.'],['COUNTER-HIT','Hit someone mid-attack for extra damage and stun.'],['DIZZY','Take too many hits too fast and you get stunned. Mash buttons to recover sooner!'],['DASH','Tap → → to dash in, ← ← to backdash (briefly invincible).']];
    B.forEach((b,i)=>{smallText(b[0],120,160+i*72,26,'#e63946','left');smallText(b[1],320,160+i*72,20,'#333','left');});}
   label('← → switch page   •   Enter to go back',W/2,680,22,'#666');break;}
  case 'select':{
   paperBg(.55);const two=mode==='2p';
   bigText(mode==='arcade'?'ARCADE: CHOOSE YOUR FIGHTER':mode==='training'?(sel.step?'TRAINING: CHOOSE DUMMY':'TRAINING: CHOOSE FIGHTER'):(!two&&sel.step?'CHOOSE YOUR OPPONENT':'CHOOSE YOUR FIGHTER'),W/2,52,48,'#222',-.02);
   const cw=180,gap=16,x0=(W-(cw*6+gap*5))/2,cy=100,chh=330;
   CHARS.forEach((c,i)=>{
    const x=x0+i*(cw+gap);ctx.save();ctx.translate(x+cw/2,cy+chh/2);ctx.rotate((i%2?1:-1)*.012);ctx.translate(-(x+cw/2),-(cy+chh/2));
    ctx.fillStyle='#fff';ctx.fillRect(x,cy,cw,chh);ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.strokeRect(x,cy,cw,chh);
    ctx.fillStyle=c.color;ctx.fillRect(x,cy,cw,44);ctx.strokeRect(x,cy,cw,44);bigText(c.name,x+cw/2,cy+23,30,'#fff');
    const f=previews[i];f.x=x+cw/2-6;f.gy=cy+232;f.face=1;f.vface=1;f.idx=i;const locked=(sel.lock[0]&&sel.cur[0]===i)||(sel.lock[1]&&sel.cur[1]===i);f.state=locked?'win':'idle';f.showBlock=false;f.computeJ();drawFighter(f);
    fitText(c.desc,x+cw/2,cy+255,cw-14,14,'#333');
    ['SPEED','POWER','HEALTH'].forEach((s,k)=>{const yy=cy+280+k*17;smallText(s,x+12,yy,12,'#444','left');for(let n=0;n<5;n++){ctx.fillStyle=n<c.stats[k]?c.color:'#eee';ctx.fillRect(x+72+n*20,yy-6,15,12);ctx.lineWidth=1.5;ctx.strokeRect(x+72+n*20,yy-6,15,12);}});
    ctx.restore();
    for(let p=0;p<2;p++){if(sel.cur[p]!==i)continue;if(!two&&p===1&&sel.step===0)continue;
     const col=p?'#3a86ff':'#e63946',pad=p?13:7;ctx.lineWidth=6;ctx.strokeStyle=col;ctx.setLineDash(sel.lock[p]?[]:[16,9]);ctx.lineDashOffset=-gt;ctx.strokeRect(x-pad,cy-pad,cw+pad*2,chh+pad*2);ctx.setLineDash([]);
     bigText(p?(two?'2P':mode==='training'?'DUMMY':'CPU'):'1P',p?x+cw-14:x+14,cy-pad-4,24,col);}
   });
   const show=two?[0,1]:[sel.step];
   show.forEach((p,k)=>{const ch=CHARS[sel.cur[p]],x=two?(k?W/2+20:60):W/2-380,w=two?W/2-80:760;
    ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(x,452,w,200);ctx.lineWidth=3;ctx.strokeStyle=ch.color;ctx.strokeRect(x,452,w,200);
    label(ch.name+' — MOVES',x+16,474,22,ch.color,'left');
    moveLines(ch).forEach((l,j)=>{smallText(l[0],x+16,508+j*34,17,'#222','left');smallText(l[1],x+w-16,508+j*34,19,ch.dark,'right');});});
   label(two?'P1: A/D + U to lock   •   P2: ←/→ + Num4 to lock   •   K / Num2 to un-ready':'←/→ choose  •  Enter / U to lock in  •  Esc back',W/2,690,20,'#555');
   break;}
  case 'stage':{
   const id=stageSel<STAGE_IDS.length?STAGE_IDS[stageSel]:null;
   if(id){ctx.drawImage(STAGES[id].bg,0,0);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,H);}else{paperBg(.3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);}
   bigText('CHOOSE A STAGE',W/2,70,60,'#ffd60a',-.02);
   const tw=180,th=101,g=14,n=STAGE_IDS.length+1,x0=(W-(tw*n+g*(n-1)))/2;
   for(let i=0;i<n;i++){const x=x0+i*(tw+g),y=520,on=i===stageSel;ctx.fillStyle='#fff';ctx.fillRect(x-4,y-4,tw+8,th+34);
    if(i<STAGE_IDS.length)ctx.drawImage(STAGES[STAGE_IDS[i]].bg,x,y,tw,th);else{ctx.fillStyle='#ddd';ctx.fillRect(x,y,tw,th);bigText('?',x+tw/2,y+th/2,60,'#888');}
    smallText(i<STAGE_IDS.length?STAGES[STAGE_IDS[i]].name:'RANDOM',x+tw/2,y+th+14,15,'#222');
    if(on){ctx.lineWidth=6;ctx.strokeStyle='#e63946';ctx.strokeRect(x-8,y-8,tw+16,th+42);}}
   bigText(id?STAGES[id].name:'RANDOM',W/2,300,80,'#fff',-.03);
   label('←/→ choose  •  Enter to fight  •  Esc back',W/2,690,22,'#222');break;}
  case 'vs':{
   const id=arcade.ladder[arcade.idx],opp=id==='hand'?BOSS_CH:charById(id);
   ctx.fillStyle=arcade.c.color;ctx.fillRect(0,0,W,H);ctx.fillStyle=opp.color;ctx.beginPath();ctx.moveTo(W/2+120,0);ctx.lineTo(W,0);ctx.lineTo(W,H);ctx.lineTo(W/2-120,H);ctx.closePath();ctx.fill();
   ctx.globalAlpha=.15;ctx.drawImage(STAGES.notebook.bg,0,0);ctx.globalAlpha=1;
   const sl=Math.min(1,sceneT/20);
   vsF[0].x=lerp(-200,320,sl);vsF[0].computeJ();drawFighter(vsF[0]);
   if(vsF[1]){vsF[1].x=lerp(W+200,W-320,sl);vsF[1].computeJ();drawFighter(vsF[1]);}
   else{const B=new Hand();B.x=lerp(W+200,W-320,sl);B.y=250+Math.sin(gt*.05)*10;drawHand(B);}
   bigText(arcade.c.name,320,80,64,'#fff',-.05);bigText(opp.name,W-320,80,64,'#fff',.05);
   bigText('VS',W/2,330,170,'#ffd60a',-.08,pop(sceneT/12));
   label(id==='hand'?'FINAL BATTLE — '+STAGES.final.name:'STAGE '+(arcade.idx+1)+' — '+STAGES[opp.stage].name,W/2,470,28,'#222');
   arcade.ladder.forEach((lid,i)=>{const c=lid==='hand'?BOSS_CH:charById(lid),x=W/2-(arcade.ladder.length-1)*45+i*90,y=640;
    ctx.beginPath();ctx.arc(x,y,30,0,7);ctx.fillStyle=c.color;ctx.fill();ctx.lineWidth=i===arcade.idx?6:3;ctx.strokeStyle=i===arcade.idx?'#ffd60a':'#222';ctx.stroke();
    smallText(lid==='hand'?'✋':c.name[0],x,y+2,26,'#fff');if(i<arcade.idx){ctx.strokeStyle='#222';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-22,y-22);ctx.lineTo(x+22,y+22);ctx.moveTo(x+22,y-22);ctx.lineTo(x-22,y+22);ctx.stroke();}});
   break;}
  case 'fight':
   drawMatch(match,true);
   if(match.training)drawTraining(match);
   if(match.phase==='over'){
    const i=match.matchWinner;
    if(mode==='arcade'){if(i===0){bigText(match.isBoss?'YOU BEAT THE HAND!':'YOU WIN!',W/2,250,100,arcade.c.color,-.05,pop(match.pt/12));if(match.pt>100&&(gt>>4)%2===0)label('Press Enter to continue',W/2,380,30,'#222');}}
    else{const s=mode==='vcpu'?(i===0?'YOU WIN!':'YOU LOSE...'):'PLAYER '+(i+1)+' WINS!';bigText(s,W/2,250,100,match.f[i].ch.color,-.05,pop(match.pt/12));
     if(match.pt>60&&(gt>>4)%2===0)label('ENTER = rematch     ESC = character select',W/2,380,30,'#222');}
   }
   if(paused&&!showMoves){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);bigText(match.training?'TRAINING MENU':'PAUSED',W/2,90,70,'#ffd60a');
    const items=pauseItems(),gap=items.length>6?50:64;items.forEach((t,k)=>{const y=180+k*gap;if(k===menuIdx)bigText(t,W/2,y,34,'#ffd60a');else smallText(t,W/2,y,28,'#ddd');});
    smallText('↑↓ choose  •  ←→ / Enter change  •  Esc resume',W/2,690,20,'#bbb');}
   if(showMoves)drawMoveList(match.isBoss?[match.f[0].ch]:mode==='2p'?[match.f[0].ch,match.f[1].ch]:[match.f[0].ch]);
   break;
  case 'continue':{
   const n=Math.max(0,9-Math.floor(sceneT/66));ctx.fillStyle='#14141a';ctx.fillRect(0,0,W,H);
   if(sceneT<600){bigText('CONTINUE?',W/2,200,100,'#ffd60a',-.04);bigText(String(n),W/2,380,200,'#e63946',0,pop((sceneT%66)/8));label('Press Enter to keep fighting',W/2,560,30,'#fff');}
   else bigText('GAME OVER',W/2,330,120,'#e63946',-.04);
   break;}
  case 'ending':{
   paperBg(.2);const f=vsF[0];f.x=W/2;f.gy=GROUND;f.pv=1;f.state='win';f.t++;f.computeJ();drawFighter(f);
   bigText('THE END',W/2,110,110,'#e63946',-.04,pop(sceneT/14));
   const lines=['THE HAND drops its pencil and slinks off the page.',arcade.c.name+' is the undisputed champion of the notebook!','Continues used: '+arcade.cont+'      Time: '+Math.floor((gt-arcade.start)/3600)+'m '+Math.floor((gt-arcade.start)/60)%60+'s'];
   lines.forEach((l,i)=>{if(sceneT>40+i*40)label(l,W/2,230+i*50,i===2?24:30,'#222');});
   if(sceneT>120&&(gt>>4)%2===0)label('Press Enter',W/2,690,26,'#222');break;}
 }
}
function drawTraining(m){
 const t=m.training;
 const ad=t.adv;const advTxt=ad===null||ad===undefined?'--':(ad>0?'+':'')+ad;
 const cb=t.combo?(t.combo.hits+' hits / '+t.combo.dmg+' dmg'):'--';
 ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(W/2-300,100,600,64);ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.strokeRect(W/2-300,100,600,64);
 smallText('COMBO: '+cb,W/2-150,120,20,'#222');smallText('FRAME ADV: '+advTxt,W/2+170,120,20,ad>0?'#2a9d3f':ad<0?'#e63946':'#222');
 smallText('DUMMY: '+DUMMY_MODES.find(d=>d[0]===t.dummy)[1]+'   •   R: reset   •   Esc: training menu',W/2,148,15,'#555');
 if(t.input){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(20,110,150,30+inputLog.length*30);
  inputLog.forEach((e,i)=>{const y=130+i*30;smallText(GLYPH[e.d],40,y,24,'#222');smallText(e.b,70,y,15,'#e63946','left');smallText(String(Math.min(99,e.n)),160,y,13,'#888','right');});}
}

let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

</script>
